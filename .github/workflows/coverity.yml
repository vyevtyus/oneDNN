name: Coverity Scan

on:
  push:
    branches: [dev/vyevtyus/coverity_scan_enabling_debug]
  #* allows this workflow to be invoked by another workflow
  workflow_call:
  #* allows manual trigger of workflow when needed
  workflow_dispatch:

permissions: read-all

env:
  COVERITY_PROJECT: vyevtyus%2FoneDNN
  COVERITY_PROJECT_ID: 30384

jobs:
  coverity_linux:
    name: Coverity Linux
    if: github.repository == 'vyevtyus/oneDNN'
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download Coverity Build Tool (linux64)
        run: |
          curl --fail https://scan.coverity.com/download/cxx/linux64 --output ${GITHUB_WORKSPACE}/cov-linux64-tool.tar.gz \
            --data "token=${{secrets.COVERITY_TOKEN}}&project=${{env.COVERITY_PROJECT}}" || { echo "Download failed"; exit 1; }
          mkdir cov-linux64-tool
          tar -xzf cov-linux64-tool.tar.gz --strip 1 -C cov-linux64-tool

      - name: Download Intel compiler
        run: |
          wget --progress=dot:giga https://registrationcenter-download.intel.com/akdlm/IRC_NAS/cd63be99-88b0-4981-bea1-2034fe17f5cf/intel-dpcpp-cpp-compiler-2025.1.0.573_offline.sh
          sudo bash intel-dpcpp-cpp-compiler-2025.1.0.573_offline.sh -s -a -s --action install --eula accept

      - name: Prepare and run Coverity build
        run: |
          source /opt/intel/oneapi/setvars.sh
          export CC=icx
          export CXX=icpx
          export PATH="${PWD}/cov-linux64-tool/bin:${PATH}"
          cov-configure --template --compiler icx --comptype intel_icx:linux
          mkdir -p build && cd build
          cmake .. -DDNNL_CPU_RUNTIME=SYCL -DDNNL_GPU_RUNTIME=SYCL
          cov-build --dir cov-int cmake --build . --parallel $(nproc)

      - name: Archive Coverity build results
        run: |
          cd build
          tar -czvf cov-int.tgz cov-int
          size=$(du -m cov-int.tgz | cut -f1)
          echo "Artifact size: $size MB"
          echo "size=$size" >> $GITHUB_OUTPUT

